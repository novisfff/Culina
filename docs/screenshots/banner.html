<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culina · 家庭饮食管理</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FAF8F5; color: #2F251E; font-family: 'PingFang SC', 'Hiragino Sans GB', sans-serif; }
  main { width: 1280px; height: 440px; display: grid; grid-template-columns: 720px 560px; overflow: hidden; }
  .intro { padding: 44px 52px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; border-radius: 16px; }
  .brand strong { font-size: 30px; letter-spacing: -1px; }
  .brand span { border-left: 1px solid #E6D9CD; padding-left: 16px; color: #6A5B51; font-size: 14px; }
  h1 { font-size: 44px; line-height: 1.4; letter-spacing: -1px; margin: 30px 0 14px; font-weight: 650; }
  h1 em { color: #B35122; font-style: normal; }
  p { color: #6A5B51; font-size: 17px; line-height: 1.85; margin: 0; }
  .tags { margin-top: 30px; display: flex; gap: 10px; }
  .tags span { padding: 8px 14px; border: 1px solid #E6D9CD; border-radius: 100px; font-size: 13px; color: #6A5B51; background: #FFFFFF; }
  .photo { position: relative; margin: 20px 20px 20px 0; border-radius: 24px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; }
</style>
<main>
  <div class="intro">
    <div class="brand"><img src="{{LOGO}}" alt="Culina 标志"><strong>Culina</strong><span>家庭饮食管理 · Web / PWA</span></div>
    <h1>把一日三餐，<br><em>过成家的日常。</em></h1>
    <p>从「今天吃什么」到「这顿真好吃」。<br>让菜谱、食材、计划与回忆，在一处相遇。</p>
    <div class="tags"><span>一家人一起用</span><span>手机随手记</span><span>AI 帮忙安排</span><span>支持自部署</span></div>
  </div>
  <div class="photo"><img src="{{KITCHEN}}" alt="阳光洒进厨房，餐桌上摆着早餐"></div>
</main>
</html>
