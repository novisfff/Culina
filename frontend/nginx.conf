map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map "$request_method:$uri" $culina_rate_class {
    default none;
    "POST:/api/auth/login" login;
    "POST:/api/auth/refresh" refresh;
    "PATCH:/api/auth/password" sensitive;
    "PATCH:/api/family" sensitive;
    "POST:/api/members" sensitive;
    ~^PATCH:/api/members/[^/]+$ sensitive;
    ~^(PUT|POST|PATCH|DELETE):/api/family/model-settings(?:/|$) sensitive;
    ~^(PUT|POST|PATCH|DELETE):/api/model-usage(?:/|$) sensitive;
    ~^GET:/api/media/[^/]+/access$ media_access;
    ~^GET:/api/media/[^/]+/content$ media_content;
    ~^[A-Z]+:/api/ general;
}

map $culina_rate_class $culina_login_limit_key {
    default "";
    login $binary_remote_addr;
}

map $culina_rate_class $culina_refresh_limit_key {
    default "";
    refresh $binary_remote_addr;
}

map $culina_rate_class $culina_sensitive_limit_key {
    default "";
    sensitive $binary_remote_addr;
}

map $culina_rate_class $culina_api_limit_key {
    default "";
    general $binary_remote_addr;
}

map $culina_rate_class $culina_media_access_limit_key {
    default "";
    media_access $binary_remote_addr;
}

map $culina_rate_class $culina_media_content_limit_key {
    default "";
    media_content $binary_remote_addr;
}

limit_req_zone $culina_login_limit_key zone=culina_login:10m rate=5r/m;
limit_req_zone $culina_refresh_limit_key zone=culina_refresh:10m rate=60r/m;
limit_req_zone $culina_sensitive_limit_key zone=culina_sensitive:10m rate=10r/m;
limit_req_zone $culina_api_limit_key zone=culina_api:10m rate=300r/m;
limit_req_zone $culina_media_access_limit_key zone=culina_media_access:10m rate=600r/m;
limit_req_zone $culina_media_content_limit_key zone=culina_media_content:10m rate=1200r/m;

log_format culina_access '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;
    access_log /var/log/nginx/access.log culina_access;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_req_log_level warn;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; manifest-src 'self'; worker-src 'self' blob:" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "microphone=(self), camera=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    error_page 429 = @rate_limited;

    location @rate_limited {
        internal;
        default_type application/json;
        return 429 '{"detail":{"code":"rate_limited","message":"请求过于频繁，请稍后重试"}}';
    }

    location ~ ^/api/media/[^/]+/content$ {
        # Upstream errors can include the complete request target, including the
        # short-lived capability. Suppress those request-bearing error entries.
        error_log /dev/stderr crit;
        # Gallery reads have a separate budget so image bursts neither exhaust
        # ordinary API traffic nor bypass edge protection.
        limit_req zone=culina_media_content burst=200 nodelay;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=culina_login burst=5 nodelay;
        limit_req zone=culina_refresh burst=10 nodelay;
        limit_req zone=culina_sensitive burst=5 nodelay;
        limit_req zone=culina_api burst=100 nodelay;
        limit_req zone=culina_media_access burst=100 nodelay;
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
