services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: culina-media-smoke-root
      MYSQL_DATABASE: culina_media_permission_smoke
      MYSQL_USER: culina_smoke
      MYSQL_PASSWORD: culina-media-smoke-db-password
      MYSQL_INITDB_SKIP_TZINFO: "1"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s

  minio:
    image: minio/minio:RELEASE.2023-11-06T22-26-08Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: culina_smoke
      MINIO_ROOT_PASSWORD: culina-media-smoke-minio-password
    ports:
      - target: 9000
        published: "${CULINA_MEDIA_SMOKE_MINIO_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      ENVIRONMENT: test
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: culina_media_permission_smoke
      MYSQL_USER: culina_smoke
      MYSQL_PASSWORD: culina-media-smoke-db-password
      JWT_SECRET: culina-media-permission-smoke-jwt-secret-at-least-32-bytes
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: culina_smoke
      MINIO_SECRET_KEY: culina-media-smoke-minio-password
      MINIO_BUCKET: culina-media
      MINIO_SECURE: "false"
      FRONTEND_ORIGIN: http://frontend
      AI_TRACE_ENABLED: "false"
      MODEL_USAGE_REQUIRED: "false"
      MODEL_USAGE_MAINTENANCE_ENABLED: "false"
      FAMILY_MODEL_MAINTENANCE_ENABLED: "false"
      SEARCH_HYBRID_ENABLED: "false"
      SEARCH_KEYWORD_BACKEND: mysql
      SEARCH_VECTOR_BACKEND: disabled
      INITIAL_ADMIN_USERNAME: media-smoke-owner
      INITIAL_ADMIN_PASSWORD: MediaSmokeOwner123
      INITIAL_ADMIN_DISPLAY_NAME: 媒体权限 Smoke 管理员
      INITIAL_FAMILY_NAME: 媒体权限 Smoke 家庭
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5).read()"
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 20s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - target: 80
        published: "${CULINA_MEDIA_SMOKE_PORT:-0}"
        host_ip: 127.0.0.1
        protocol: tcp
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s
