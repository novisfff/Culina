name: culina-realtime-websocket-smoke

services:
  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    command:
      - uvicorn
      - tests.deployment.websocket_echo_server:app
      - --host
      - 0.0.0.0
      - --port
      - "8010"
      - --no-access-log
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5).read()"
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 5s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "${CULINA_WS_SMOKE_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
