name: culina

services:
  mysql:
    image: mysql:8.4
    container_name: culina-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-culina_local_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-culina}
      MYSQL_USER: ${MYSQL_USER:-culina}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-culina_local_password}
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - culina_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2023-11-06T22-26-08Z
    container_name: culina-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-culina}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-culina_local_minio_secret}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - culina_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: culina-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - culina_qdrant_data:/qdrant/storage

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    container_name: culina-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-culina}
      MYSQL_USER: ${MYSQL_USER:-culina}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-culina_local_password}
      JWT_SECRET: ${JWT_SECRET:-culina-local-dev-secret}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      MEDIA_MAX_UPLOAD_BYTES: ${MEDIA_MAX_UPLOAD_BYTES:-31457280}
      MEDIA_ACCESS_URL_TTL_SECONDS: ${MEDIA_ACCESS_URL_TTL_SECONDS:-300}
      REALTIME_WEBSOCKET_TICKET_TTL_SECONDS: ${REALTIME_WEBSOCKET_TICKET_TTL_SECONDS:-45}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-culina}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-culina_local_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-culina-media}
      MINIO_SECURE: "false"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      AI_TRACE_ENABLED: ${AI_TRACE_ENABLED:-true}
      AI_TRACE_CAPTURE_LLM_EXCHANGES: ${AI_TRACE_CAPTURE_LLM_EXCHANGES:-false}
      AI_TRACE_CAPTURE_MESSAGE_CONTENT: ${AI_TRACE_CAPTURE_MESSAGE_CONTENT:-false}
      AI_TRACE_CAPTURE_STREAM_CHUNKS: ${AI_TRACE_CAPTURE_STREAM_CHUNKS:-false}
      AI_TRACE_CAPTURE_IMAGE_BYTES: ${AI_TRACE_CAPTURE_IMAGE_BYTES:-false}
      AI_TRACE_PAYLOAD_MODE: ${AI_TRACE_PAYLOAD_MODE:-redacted}
      AI_TRACE_RETENTION_DAYS: ${AI_TRACE_RETENTION_DAYS:-7}
      AI_TRACE_MAX_REQUEST_BYTES: ${AI_TRACE_MAX_REQUEST_BYTES:-1048576}
      AI_TRACE_MAX_RESPONSE_BYTES: ${AI_TRACE_MAX_RESPONSE_BYTES:-1048576}
      MODEL_USAGE_REQUIRED: ${MODEL_USAGE_REQUIRED:-false}
      MODEL_USAGE_MAINTENANCE_ENABLED: ${MODEL_USAGE_MAINTENANCE_ENABLED:-true}
      MODEL_USAGE_DEFAULT_HARD_LIMIT: ${MODEL_USAGE_DEFAULT_HARD_LIMIT:-false}
      MODEL_USAGE_RECEIPT_QUEUE_SIZE: ${MODEL_USAGE_RECEIPT_QUEUE_SIZE:-1000}
      MODEL_USAGE_RECEIPT_INTEGRITY_ACTIVE_KEY_ID: ${MODEL_USAGE_RECEIPT_INTEGRITY_ACTIVE_KEY_ID:-}
      MODEL_USAGE_RECEIPT_INTEGRITY_KEYS_JSON: ${MODEL_USAGE_RECEIPT_INTEGRITY_KEYS_JSON:-}
      MODEL_USAGE_FAIL_OPEN_PROOF_TTL_SECONDS: ${MODEL_USAGE_FAIL_OPEN_PROOF_TTL_SECONDS:-5}
      MODEL_USAGE_SOURCE_INSTANCE: ${MODEL_USAGE_SOURCE_INSTANCE:-culina-api}
      FAMILY_MODEL_CREDENTIAL_ACTIVE_KEY_ID: ${FAMILY_MODEL_CREDENTIAL_ACTIVE_KEY_ID:-}
      FAMILY_MODEL_CREDENTIAL_KEYS_JSON: ${FAMILY_MODEL_CREDENTIAL_KEYS_JSON:-}
      FAMILY_MODEL_CREDENTIAL_KEYRING_FILE: ${FAMILY_MODEL_CREDENTIAL_KEYRING_FILE:-/app/storage/secrets/family-model-credential-keyring.json}
      FAMILY_MODEL_REVOKED_SECRET_RETENTION_HOURS: ${FAMILY_MODEL_REVOKED_SECRET_RETENTION_HOURS:-24}
      FAMILY_MODEL_PRIVATE_TARGET_ALLOWLIST_JSON: ${FAMILY_MODEL_PRIVATE_TARGET_ALLOWLIST_JSON:-}
      FAMILY_MODEL_ALLOW_INSECURE_PUBLIC_TRANSPORTS: ${FAMILY_MODEL_ALLOW_INSECURE_PUBLIC_TRANSPORTS:-false}
      FAMILY_MODEL_EGRESS_PROXY_URL: ${FAMILY_MODEL_EGRESS_PROXY_URL:-}
      FAMILY_MODEL_PROVIDER_CONNECT_TIMEOUT_SECONDS: ${FAMILY_MODEL_PROVIDER_CONNECT_TIMEOUT_SECONDS:-10}
      FAMILY_MODEL_PROVIDER_REQUEST_TIMEOUT_SECONDS: ${FAMILY_MODEL_PROVIDER_REQUEST_TIMEOUT_SECONDS:-180}
      FAMILY_MODEL_PROVIDER_RESPONSE_MAX_BYTES: ${FAMILY_MODEL_PROVIDER_RESPONSE_MAX_BYTES:-8388608}
      FAMILY_MODEL_PROVIDER_MEDIA_MAX_BYTES: ${FAMILY_MODEL_PROVIDER_MEDIA_MAX_BYTES:-31457280}
      FAMILY_MODEL_PROVIDER_REDIRECT_LIMIT: ${FAMILY_MODEL_PROVIDER_REDIRECT_LIMIT:-0}
      FAMILY_MODEL_AUDIO_UPLOAD_MAX_BYTES: ${FAMILY_MODEL_AUDIO_UPLOAD_MAX_BYTES:-10485760}
      FAMILY_MODEL_STT_MAX_DURATION_SECONDS: ${FAMILY_MODEL_STT_MAX_DURATION_SECONDS:-60}
      FAMILY_MODEL_TTS_MAX_CHARACTERS: ${FAMILY_MODEL_TTS_MAX_CHARACTERS:-4096}
      FAMILY_MODEL_REALTIME_SESSION_MAX_SECONDS: ${FAMILY_MODEL_REALTIME_SESSION_MAX_SECONDS:-300}
      FAMILY_MODEL_QDRANT_COLLECTION_PREFIX: ${FAMILY_MODEL_QDRANT_COLLECTION_PREFIX:-culina_fsp}
      FAMILY_MODEL_RETIRED_COLLECTION_RETENTION_DAYS: ${FAMILY_MODEL_RETIRED_COLLECTION_RETENTION_DAYS:-7}
      FAMILY_MODEL_MAINTENANCE_ENABLED: ${FAMILY_MODEL_MAINTENANCE_ENABLED:-true}
      SEARCH_HYBRID_ENABLED: ${SEARCH_HYBRID_ENABLED:-true}
      SEARCH_KEYWORD_BACKEND: mysql
      SEARCH_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-CulinaAdmin123!}
      INITIAL_ADMIN_DISPLAY_NAME: ${INITIAL_ADMIN_DISPLAY_NAME:-家庭管理员}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PHONE: ${INITIAL_ADMIN_PHONE:-}
      INITIAL_FAMILY_NAME: ${INITIAL_FAMILY_NAME:-Culina 家庭厨房}
      INITIAL_FAMILY_MOTTO: ${INITIAL_FAMILY_MOTTO:-}
      INITIAL_FAMILY_LOCATION: ${INITIAL_FAMILY_LOCATION:-}
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - culina_backend_secrets:/app/storage/secrets
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/api/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: culina-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  culina_mysql_data:
  culina_minio_data:
  culina_qdrant_data:
  culina_backend_secrets:
