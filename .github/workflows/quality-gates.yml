name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify PR Gates
    runs-on: ubuntu-latest
    outputs:
      risk: ${{ steps.classify.outputs.risk }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full: ${{ steps.classify.outputs.full }}
      domains: ${{ steps.classify.outputs.domains }}
      frontend_scopes: ${{ steps.classify.outputs.frontend_scopes }}
      frontend_focus: ${{ steps.classify.outputs.frontend_focus }}
      frontend_typecheck: ${{ steps.classify.outputs.frontend_typecheck }}
      frontend_full: ${{ steps.classify.outputs.frontend_full }}
      frontend_style: ${{ steps.classify.outputs.frontend_style }}
      frontend_build: ${{ steps.classify.outputs.frontend_build }}
      frontend_e2e: ${{ steps.classify.outputs.frontend_e2e }}
      frontend_ai_contract: ${{ steps.classify.outputs.frontend_ai_contract }}
      backend_service: ${{ steps.classify.outputs.backend_service }}
      backend_ai: ${{ steps.classify.outputs.backend_ai }}
      ai_evals: ${{ steps.classify.outputs.ai_evals }}
      backend_search: ${{ steps.classify.outputs.backend_search }}
      backend_mysql: ${{ steps.classify.outputs.backend_mysql }}
      backend_migration: ${{ steps.classify.outputs.backend_migration }}
      dependency_audit: ${{ steps.classify.outputs.dependency_audit }}
      deployment_smokes: ${{ steps.classify.outputs.deployment_smokes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test gate classifier
        run: node --test .github/scripts/classify-pr-gates.test.mjs
      - name: Classify changed paths and risk
        id: classify
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: node .github/scripts/classify-pr-gates.mjs

  backend-service:
    name: Backend Service Tests
    needs: classify
    if: needs.classify.outputs.backend_service == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend service tests
        run: npm run backend:test:service

  backend-ai:
    name: Backend AI Tests
    needs: classify
    if: needs.classify.outputs.backend_ai == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend AI tests
        run: npm run backend:test:ai

  ai-skill-evals:
    name: AI Skill Evaluation Gate
    needs: classify
    if: needs.classify.outputs.ai_evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run deterministic AI skill evaluations
        env:
          CULINA_AI_EVAL_REPORT_PATH: .artifacts/ai-skill-eval-report.json
        run: npm run backend:test:ai-evals
      - name: Check AI skill thresholds
        run: npm run backend:check:ai-evals
      - name: Upload AI skill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-skill-eval-report
          path: backend/.artifacts/ai-skill-eval-report.json

  backend-search:
    name: Backend Search Tests
    needs: classify
    if: needs.classify.outputs.backend_search == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend search tests
        run: npm run backend:test:search

  backend-mysql-suite:
    name: Backend MySQL (${{ matrix.suite }})
    needs: classify
    if: needs.classify.outputs.backend_mysql == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: family-model-settings
            command: npm run backend:test:family-model-settings -- --durations=20
          - suite: model-usage-core
            command: npm run backend:test:model-usage -- --ignore=tests/model_usage/test_reporting_queries_mysql.py --durations=20
          - suite: model-usage-reporting
            command: cd backend && .venv/bin/python -m pytest tests/model_usage/test_reporting_queries_mysql.py -q --durations=20
          - suite: ai-resume-concurrency
            command: cd backend && .venv/bin/python -m pytest tests/ai_infra/test_human_input_resume_mysql_concurrency.py -q --durations=20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: culina_model_usage_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CULINA_TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/culina_model_usage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run ${{ matrix.suite }} with MySQL 8.4
        run: ${{ matrix.command }}

  backend-model-usage:
    name: Backend Model Usage Tests
    if: ${{ always() && needs.backend-mysql-suite.result != 'skipped' }}
    needs: backend-mysql-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every backend MySQL suite to pass
        env:
          SUITE_RESULT: ${{ needs.backend-mysql-suite.result }}
        run: |
          if [ "$SUITE_RESULT" != "success" ]; then
            echo "Backend MySQL suites finished with: $SUITE_RESULT"
            exit 1
          fi

  backend-migration-smoke:
    name: Alembic Head and Migration Smoke
    needs: classify
    if: needs.classify.outputs.backend_migration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: culina_migration_smoke
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ENVIRONMENT: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: culina_migration_smoke
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Verify one head and upgrade disposable MySQL twice
        run: npm run backend:migrate:smoke

  production-dependency-audit:
    name: Production Dependency Audit
    needs: classify
    if: needs.classify.outputs.dependency_audit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend audit tool
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install pip-audit==2.9.0
      - name: Audit production dependency graphs
        run: npm run audit:prod

  frontend-typecheck:
    name: Frontend Typecheck
    needs: classify
    if: needs.classify.outputs.frontend_typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend typecheck
        run: npm run frontend:typecheck

  frontend-domain-tests:
    name: Frontend Domain Tests
    needs: classify
    if: needs.classify.outputs.frontend_focus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FRONTEND_TEST_SCOPES: ${{ needs.classify.outputs.frontend_scopes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run selected frontend domain tests
        run: node .github/scripts/run-frontend-domain-tests.mjs

  frontend-ai-contract:
    name: Frontend AI Contract
    needs: classify
    if: needs.classify.outputs.frontend_ai_contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run AI workspace contract tests
        run: npm --prefix frontend test -- src/lib/aiWorkspaceContracts.test.ts

  frontend-vitest-shard:
    name: Frontend Vitest Shard ${{ matrix.shard }}/2
    needs: classify
    if: needs.classify.outputs.frontend_full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend test shard ${{ matrix.shard }}/2
        run: npm run frontend:test -- --shard=${{ matrix.shard }}/2

  frontend-vitest:
    name: Frontend Vitest
    if: ${{ always() && needs.frontend-vitest-shard.result != 'skipped' }}
    needs: frontend-vitest-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every frontend Vitest shard to pass
        env:
          SHARD_RESULT: ${{ needs.frontend-vitest-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Frontend Vitest shards finished with: $SHARD_RESULT"
            exit 1
          fi

  frontend-style-drift:
    name: Frontend Incremental Style Drift
    needs: classify
    if: needs.classify.outputs.frontend_style == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Block new style token drift
        run: npm --prefix frontend run check:style-tokens

  frontend-governance:
    name: Frontend Governance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Prepare frontend governance artifacts
        run: mkdir -p .artifacts
      - name: Generate frontend coverage topology report
        run: npm --prefix frontend run coverage:report
      - name: Generate frontend health report
        run: npm --prefix frontend run health:report -- --format json --output "$GITHUB_WORKSPACE/.artifacts/frontend-health.json"
      - name: Build frontend logical manifest
        run: npm --prefix frontend run build:manifest
      - name: Archive frontend logical manifest
        run: |
          test -s frontend/dist/.vite/frontend-health-manifest.json
          cp frontend/dist/.vite/frontend-health-manifest.json .artifacts/frontend-health-manifest.json
      - name: Enforce frontend governance ratchet
        run: npm --prefix frontend run check:governance -- --mode=ratchet --health="$GITHUB_WORKSPACE/.artifacts/frontend-health.json" --manifest="$GITHUB_WORKSPACE/.artifacts/frontend-health-manifest.json" --coverage="$GITHUB_WORKSPACE/.artifacts/frontend-coverage-topology.json" --result="$GITHUB_WORKSPACE/.artifacts/frontend-governance-result.json"
      - name: Upload frontend governance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-governance
          path: |
            .artifacts/frontend-health.json
            .artifacts/frontend-health-manifest.json
            .artifacts/frontend-governance-result.json
            .artifacts/frontend-coverage-topology.json
            frontend/coverage/coverage-summary.json
            frontend/coverage/vitest-results.json
          if-no-files-found: warn
          retention-days: 14

  frontend-release-evidence:
    name: Frontend Release Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ github.workspace }}/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare release evidence artifacts
        run: mkdir -p .artifacts
      - name: Build frontend and manifest
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Generate route transfer report
        run: npm run route-transfer-report -- dist/.vite/frontend-health-manifest.json .artifacts/route-transfer-report.json
      - name: Run six viewport release evidence journey
        env:
          RELEASE_EVIDENCE_OUTPUT: ${{ github.workspace }}/frontend/.artifacts/release-request-report.json
        run: npx playwright test e2e/release-governance-evidence.spec.mjs --project=desktop-1440x960 --grep @release-evidence --workers=1
      - name: Generate budget result
        run: node scripts/check-bundle-budgets.mjs --mode=report --manifest=dist/.vite/frontend-health-manifest.json --result=.artifacts/budget-result.json
      - name: Generate release metadata
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: node -e "const fs=require('fs'); const p=require('./package.json'); fs.writeFileSync('.artifacts/release-evidence.json', JSON.stringify({buildCommit:process.env.RELEASE_COMMIT,nodeVersion:process.version,viteVersion:p.devDependencies?.vite||p.dependencies?.vite||'unknown',rollbackCommand:'git revert --no-edit ${{ github.sha }}'}, null, 2)+'\\n')"
      - name: Enforce release evidence contract
        run: npm run check:release-governance -- --manifest=dist/.vite/frontend-health-manifest.json --budget-result=.artifacts/budget-result.json --viewport-report=.artifacts/release-request-report.json --request-report=.artifacts/release-request-report.json --evidence=.artifacts/release-evidence.json --result=.artifacts/release-governance-result.json
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-release-evidence
          path: |
            frontend/.artifacts/route-transfer-report.json
            frontend/.artifacts/release-request-report.json
            frontend/.artifacts/release-evidence.json
            frontend/.artifacts/budget-result.json
            frontend/.artifacts/release-governance-result.json
            frontend/dist/.vite/frontend-health-manifest.json
          if-no-files-found: warn
          retention-days: 14

  frontend-build:
    name: Frontend Build
    needs: classify
    if: needs.classify.outputs.frontend_build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend build
        run: npm run frontend:build

  frontend-e2e-p0:
    name: Frontend E2E P0
    needs: classify
    if: needs.classify.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Build frontend
        run: npm --prefix frontend run build:e2e
      - name: Run blocking P0 browser tests
        run: npm run frontend:e2e:p0
      - name: Upload P0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-p0-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  deployment-compose-smokes:
    name: Compose Media and WebSocket Smokes
    needs: classify
    if: needs.classify.outputs.deployment_smokes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deployment-test dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        id: browser_setup
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run media permission deployment smoke
        run: |
          set -o pipefail
          mkdir -p .artifacts
          npm run deploy:smoke:media 2>&1 | tee .artifacts/media-permission-smoke.log
      - name: Run WebSocket deployment smoke
        if: ${{ always() && steps.browser_setup.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p .artifacts
          npm run deploy:smoke:realtime 2>&1 | tee .artifacts/realtime-websocket-smoke.log
      - name: Upload deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-compose-smokes
          path: |
            .artifacts/*.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  pr-gate:
    name: PR Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - classify
      - frontend-domain-tests
      - frontend-typecheck
      - frontend-vitest
      - frontend-style-drift
      - frontend-build
      - frontend-e2e-p0
      - frontend-ai-contract
      - backend-service
      - backend-ai
      - ai-skill-evals
      - backend-search
      - backend-model-usage
      - backend-migration-smoke
      - production-dependency-audit
      - deployment-compose-smokes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify selected gates
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          REQUIRE_FRONTEND_FOCUS: ${{ needs.classify.outputs.frontend_focus }}
          RESULT_FRONTEND_FOCUS: ${{ needs.frontend-domain-tests.result }}
          REQUIRE_FRONTEND_TYPECHECK: ${{ needs.classify.outputs.frontend_typecheck }}
          RESULT_FRONTEND_TYPECHECK: ${{ needs.frontend-typecheck.result }}
          REQUIRE_FRONTEND_FULL: ${{ needs.classify.outputs.frontend_full }}
          RESULT_FRONTEND_FULL: ${{ needs.frontend-vitest.result }}
          REQUIRE_FRONTEND_STYLE: ${{ needs.classify.outputs.frontend_style }}
          RESULT_FRONTEND_STYLE: ${{ needs.frontend-style-drift.result }}
          REQUIRE_FRONTEND_BUILD: ${{ needs.classify.outputs.frontend_build }}
          RESULT_FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          REQUIRE_FRONTEND_E2E: ${{ needs.classify.outputs.frontend_e2e }}
          RESULT_FRONTEND_E2E: ${{ needs.frontend-e2e-p0.result }}
          REQUIRE_FRONTEND_AI_CONTRACT: ${{ needs.classify.outputs.frontend_ai_contract }}
          RESULT_FRONTEND_AI_CONTRACT: ${{ needs.frontend-ai-contract.result }}
          REQUIRE_BACKEND_SERVICE: ${{ needs.classify.outputs.backend_service }}
          RESULT_BACKEND_SERVICE: ${{ needs.backend-service.result }}
          REQUIRE_BACKEND_AI: ${{ needs.classify.outputs.backend_ai }}
          RESULT_BACKEND_AI: ${{ needs.backend-ai.result }}
          REQUIRE_AI_EVALS: ${{ needs.classify.outputs.ai_evals }}
          RESULT_AI_EVALS: ${{ needs.ai-skill-evals.result }}
          REQUIRE_BACKEND_SEARCH: ${{ needs.classify.outputs.backend_search }}
          RESULT_BACKEND_SEARCH: ${{ needs.backend-search.result }}
          REQUIRE_BACKEND_MYSQL: ${{ needs.classify.outputs.backend_mysql }}
          RESULT_BACKEND_MYSQL: ${{ needs.backend-model-usage.result }}
          REQUIRE_BACKEND_MIGRATION: ${{ needs.classify.outputs.backend_migration }}
          RESULT_BACKEND_MIGRATION: ${{ needs.backend-migration-smoke.result }}
          REQUIRE_DEPENDENCY_AUDIT: ${{ needs.classify.outputs.dependency_audit }}
          RESULT_DEPENDENCY_AUDIT: ${{ needs.production-dependency-audit.result }}
          REQUIRE_DEPLOYMENT_SMOKES: ${{ needs.classify.outputs.deployment_smokes }}
          RESULT_DEPLOYMENT_SMOKES: ${{ needs.deployment-compose-smokes.result }}
        run: node .github/scripts/verify-pr-gates.mjs
