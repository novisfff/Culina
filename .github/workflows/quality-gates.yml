name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-service:
    name: Backend Service Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend service tests
        run: npm run backend:test:service

  backend-ai:
    name: Backend AI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend AI tests
        run: npm run backend:test:ai

  ai-skill-evals:
    name: AI Skill Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run deterministic AI skill evaluations
        env:
          CULINA_AI_EVAL_REPORT_PATH: .artifacts/ai-skill-eval-report.json
        run: npm run backend:test:ai-evals
      - name: Check AI skill thresholds
        run: npm run backend:check:ai-evals
      - name: Upload AI skill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-skill-eval-report
          path: backend/.artifacts/ai-skill-eval-report.json

  backend-search:
    name: Backend Search Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run backend search tests
        run: npm run backend:test:search

  backend-mysql-suite:
    name: Backend MySQL (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: family-model-settings
            command: npm run backend:test:family-model-settings -- --durations=20
          - suite: model-usage-core
            command: npm run backend:test:model-usage -- --ignore=tests/model_usage/test_reporting_queries_mysql.py --durations=20
          - suite: model-usage-reporting
            command: cd backend && .venv/bin/python -m pytest tests/model_usage/test_reporting_queries_mysql.py -q --durations=20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: culina_model_usage_test
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CULINA_TEST_MYSQL_URL: mysql+pymysql://root:root@127.0.0.1:3306/culina_model_usage_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Run ${{ matrix.suite }} with MySQL 8.4
        run: ${{ matrix.command }}

  backend-model-usage:
    name: Backend Model Usage Tests
    if: always()
    needs: backend-mysql-suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every backend MySQL suite to pass
        env:
          SUITE_RESULT: ${{ needs.backend-mysql-suite.result }}
        run: |
          if [ "$SUITE_RESULT" != "success" ]; then
            echo "Backend MySQL suites finished with: $SUITE_RESULT"
            exit 1
          fi

  backend-migration-smoke:
    name: Alembic Head and Migration Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: culina_migration_smoke
          MYSQL_ROOT_HOST: '%'
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ENVIRONMENT: test
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DATABASE: culina_migration_smoke
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -r backend/requirements-dev.txt
      - name: Verify one head and upgrade disposable MySQL twice
        run: npm run backend:migrate:smoke

  production-dependency-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned backend audit tool
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install pip-audit==2.9.0
      - name: Audit production dependency graphs
        run: npm run audit:prod

  frontend-vitest-shard:
    name: Frontend Vitest Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend test shard ${{ matrix.shard }}/2
        run: npm run frontend:test -- --shard=${{ matrix.shard }}/2

  frontend-vitest:
    name: Frontend Vitest
    if: always()
    needs: frontend-vitest-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every frontend Vitest shard to pass
        env:
          SHARD_RESULT: ${{ needs.frontend-vitest-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "Frontend Vitest shards finished with: $SHARD_RESULT"
            exit 1
          fi

  frontend-style-drift:
    name: Frontend Incremental Style Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Block new style token drift
        run: npm --prefix frontend run check:style-tokens

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run frontend build
        run: npm run frontend:build

  frontend-e2e-p0:
    name: Frontend E2E P0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Build frontend
        run: npm --prefix frontend run build:e2e
      - name: Run blocking P0 browser tests
        run: npm run frontend:e2e:p0
      - name: Upload P0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-p0-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14

  deployment-compose-smokes:
    name: Compose Media and WebSocket Smokes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deployment-test dependencies
        run: npm ci --prefix frontend
      - name: Install Chromium
        id: browser_setup
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Run media permission deployment smoke
        run: |
          set -o pipefail
          mkdir -p .artifacts
          npm run deploy:smoke:media 2>&1 | tee .artifacts/media-permission-smoke.log
      - name: Run WebSocket deployment smoke
        if: ${{ always() && steps.browser_setup.outcome == 'success' }}
        run: |
          set -o pipefail
          mkdir -p .artifacts
          npm run deploy:smoke:realtime 2>&1 | tee .artifacts/realtime-websocket-smoke.log
      - name: Upload deployment smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-compose-smokes
          path: |
            .artifacts/*.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
